# Publishes only `demo/` to GitHub Pages.
#
# Deliberately not the repository root and not `docs/`: the demo is the one
# thing meant to be public as a *page*, while `docs/` holds PRD responses and
# the design spec, which are readable in the repo and have no business being
# served as a website.
#
# The page is static — it has no server — which is the property that makes the
# bring-your-own-key demo safe: a tester's API key goes from their browser to
# the agent service and never touches the host serving this HTML.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a stray fixture would ship
        # _sample.json is a captured agent response used to test rendering
        # locally. It is not secret, but publishing it would put a canned
        # result next to a page whose whole point is running the real thing.
        run: |
          if ls demo/_* >/dev/null 2>&1; then
            echo "Refusing to publish: demo/ contains development fixtures:" >&2
            ls -1 demo/_* >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deployment
        uses: actions/deploy-pages@v4
