# Builds the public demo image.
#
# `gcloud run deploy --source` and `gcloud builds submit --tag` both look for a
# file literally named `Dockerfile`, and this service needs `Dockerfile.demo` —
# the scaffolded one runs the ADK production entrypoint, which has no /analyze
# and needs GCP credentials at import. Hence an explicit build config.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.demo
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
