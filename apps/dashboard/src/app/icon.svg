<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Telemed.ai mark, favicon cut. Same hub-and-spoke construction as
       BrandMark.tsx, but the spokes are thicker and the gaps wider: at 16px the
       in-app proportions close up and the mark flattens into a plain plus. -->
  <defs>
    <linearGradient id="tm-tile" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d84c9"/>
      <stop offset="1" stop-color="#1d4f8a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tm-tile)"/>
  <g fill="#fff">
    <rect x="13.4" y="5.4"  width="5.2" height="7.4" rx="2.6"/>
    <rect x="13.4" y="19.2" width="5.2" height="7.4" rx="2.6"/>
    <rect x="5.4"  y="13.4" width="7.4" height="5.2" rx="2.6"/>
    <rect x="19.2" y="13.4" width="7.4" height="5.2" rx="2.6"/>
  </g>
  <circle cx="16" cy="16" r="2.8" fill="#fff"/>
</svg>
